name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Run tests with coverage
        run: npm run test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: packages/core/coverage/lcov.info,packages/evm/coverage/lcov.info,packages/sdk/coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Lint
        run: npm run lint

  build-demo:
    name: Build Demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Build demo
        run: npm run build -w pohi-demo
        env:
          NEXT_PUBLIC_WORLD_ID_APP_ID: app_staging_test
          NEXT_PUBLIC_WORLD_ID_ACTION: test_action

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build-demo
    continue-on-error: true  # TODO: Fix E2E server startup issues

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/demo

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium
        working-directory: packages/demo
        env:
          NEXT_PUBLIC_WORLD_ID_APP_ID: app_staging_test
          NEXT_PUBLIC_WORLD_ID_ACTION: test_action
          POHI_MOCK_PROVIDERS: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/demo/playwright-report/
          retention-days: 7
