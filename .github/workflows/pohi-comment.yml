name: PoHI Approval Comment

on:
  pull_request:
    types: [labeled]

permissions:
  pull-requests: write

jobs:
  post-comment:
    if: github.event.label.name == 'needs-human-approval'
    runs-on: ubuntu-latest
    steps:
      - name: Post approval link comment
        uses: actions/github-script@v7
        with:
          script: |-
            const prNumber = context.payload.pull_request.number;
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const headSha = context.payload.pull_request.head.sha;
            const shortSha = headSha.substring(0, 7);

            const approvalUrl = `https://pohi-demo.vercel.app/?repo=${owner}/${repo}&commit=${headSha}`;

            const body = [
              '## 🔏 Human Approval Required',
              '',
              'This PR requires human verification before it can be merged.',
              '',
              '- **Repository:** `' + owner + '/' + repo + '`',
              '- **Commit:** `' + shortSha + '`',
              '- **PR:** #' + prNumber,
              '',
              '### 👉 [Approve with World ID](' + approvalUrl + ')',
              '',
              'Once approved, the attestation hash will be recorded on-chain.',
              '',
              '---',
              '_Powered by [PoHI Protocol](https://github.com/pohi-protocol/pohi) - Proof of Human Intent_'
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body
            });
